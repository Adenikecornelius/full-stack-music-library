<!DOCTYPE html>
<html>
<head>
    <title>Albums</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Albums</h1>

<nav>
    <a href="index.html">Home</a>
    <a href="artists.html">Artists</a>
    <a href="albums.html">Albums</a>
    <a href="songs.html">Songs</a>
</nav>

<h2>Add / Edit Album</h2>

<input id="album-id" placeholder="ID (for editing only)" disabled>

<input id="album-name" placeholder="Album Name">
<input id="album-year" placeholder="Release Year">
<input id="album-listens" placeholder="Listens">
<input id="album-artist-id" placeholder="Artist ID">

<button onclick="createAlbum()">Create</button>
<button onclick="updateAlbum()">Update</button>

<hr>

<h2>All Albums</h2>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Year</th>
            <th>Listens</th>
            <th>Artist ID</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody id="albumTable"></tbody>
</table>

<script>
const ALBUM_API = "http://localhost:5000/albums";


async function loadAlbums() {
    const table = document.getElementById("albumTable");

    const res = await fetch(ALBUM_API);
    const data = await res.json();

    table.innerHTML = "";

    data.forEach(a => {
        table.innerHTML += `
            <tr>
                <td>${a.album_id}</td>
                <td>${a.name}</td>
                <td>${a.release_year}</td>
                <td>${a.listens}</td>
                <td>${a.artist_id}</td>
                <td>
                    <button onclick="editAlbum(${a.album_id}, '${a.name}', ${a.release_year}, ${a.listens}, ${a.artist_id})">Edit</button>
                    <button onclick="deleteAlbum(${a.album_id})">Delete</button>
                </td>
            </tr>
        `;
    });
}


async function createAlbum() {
    const name = document.getElementById("album-name").value;
    const year = document.getElementById("album-year").value;
    const listens = document.getElementById("album-listens").value;
    const artist_id = document.getElementById("album-artist-id").value;

    await fetch(ALBUM_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name,
            release_year: Number(year),
            listens: Number(listens),
            artist_id: Number(artist_id)
        })
    });

    loadAlbums();
}

function editAlbum(id, name, year, listens, artist_id) {
    document.getElementById("album-id").value = id;
    document.getElementById("album-name").value = name;
    document.getElementById("album-year").value = year;
    document.getElementById("album-listens").value = listens;
    document.getElementById("album-artist-id").value = artist_id;
}


async function updateAlbum() {
    const id = document.getElementById("album-id").value;
    const name = document.getElementById("album-name").value;
    const year = document.getElementById("album-year").value;
    const listens = document.getElementById("album-listens").value;
    const artist_id = document.getElementById("album-artist-id").value;

    await fetch(`${ALBUM_API}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name,
            release_year: Number(year),
            listens: Number(listens),
            artist_id: Number(artist_id)
        })
    });

    loadAlbums();
}


async function deleteAlbum(id) {
    await fetch(`${ALBUM_API}/${id}`, { method: "DELETE" });
    loadAlbums();
}

loadAlbums();
</script>

</body>
</html>
